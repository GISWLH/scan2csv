[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scan2csv"
version = "0.1.0"
description = "Any scanned table → CSV via multimodal agent + APIYI enhance + local OCR"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GISWLH" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "pillow>=10.0",
  "pydantic>=2.0",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
]

[project.optional-dependencies]
ocr = ["opencv-python-headless>=4.8"]
dev = ["pyinstaller>=6.0", "pytest>=8.0"]

[project.scripts]
scan2csv = "scan2csv.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scan2csv*"]

[tool.setuptools.package-data]
scan2csv = ["web/*", "web/**/*", "prompts/*"]
